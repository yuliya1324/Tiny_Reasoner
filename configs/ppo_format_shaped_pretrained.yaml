# SFT Baseline — inherits from base.yaml
training:
  method: "ppo"
  reward: "format_shaped"

  use_gradient_checkpointing;: false

  num_epochs: 3
  per_device_batch_size: 1
  gradient_accumulation_steps: 16

  learning_rate: 5.0e-6
  adam_epsilon: 1.0e-5
  weight_decay: 0.005
  
  lr_scheduler: "cosine"
  warmup_steps: 100

  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 50
  eval_steps: 200
  fp16: false
  bf16: true

  missing_eos_penalty: 0.2
  gamma: 1.
  kl_coef: 0.1
  reward_kwargs:
    format_bonus: .2
    reward: 1.

model:
  checkpoint: "results/sft_baseline/final"

output_dir: "/Data/joao.giordani-donasolo/Tiny_Reasoner/results/ppo_format_shaped_pretrained_full_reward"
experiment_name: ppo_format_shaped_pretrained_full_reward
