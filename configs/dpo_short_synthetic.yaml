training:
  method: "dpo"
  num_epochs: 3
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  fp16: true

dpo:
  beta: 0.1
  max_prompt_length: 256
  max_length: 512

model_init:
  checkpoint_path: "/Data/masayo.tomita/Tiny_Reasoner/results/sft_baseline/final"

data:
  dpo_source: "synthetic_short_chosen"
  max_train_samples: null

output_dir: "/Data/masayo.tomita/Tiny_Reasoner/results/dpo_short_chosen_synthetic"
experiment_name: "dpo_short_chosen_synthetic"