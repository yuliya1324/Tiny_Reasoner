# Base configuration — shared across all experiments
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  quantization: "4bit"
  lora:
    r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    task_type: "CAUSAL_LM"

data:
  dataset: "openai/gsm8k"
  split_name: "main"
  max_train_samples: null
  max_length: 512
  prompt_template: |
    Solve this math problem step by step.
    Put your reasoning inside <think>...</think> tags and your final numerical answer inside <answer>...</answer> tags.

    Problem: {question}

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.95
  do_sample: true

seed: 42
output_dir: "results"
