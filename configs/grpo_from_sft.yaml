# GRPO starting from SFT checkpoint (run on a separate machine in parallel)
experiment_name: "grpo_from_sft"

grpo:
  num_generations: 4
  per_device_train_batch_size: 8   # bumped from 4 (plain grpo used ~11 GB; room for more)
  gradient_accumulation_steps: 4   # effective batch 24
  learning_rate: 5.0e-6
  num_train_epochs: 1
  max_completion_length: 512
  max_prompt_length: 256
  temperature: 1.0
  beta: 0.0
  loss_type: "dr_grpo"
  bf16: false
  fp16: true
  use_liger_loss: false
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200

reward_type: "sparse"
# SFT checkpoint — same path on this machine as the other
sft_checkpoint: "/Data/yash.bhardwaj/Tiny_Reasoner/results/sft_baseline/final"

output_dir: "/Data/yash.bhardwaj/Tiny_Reasoner/results/grpo_from_sft"
