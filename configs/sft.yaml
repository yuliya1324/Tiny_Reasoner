# SFT Baseline — inherits from base.yaml
training:
  method: "sft"
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  fp16: false

output_dir: "/Data/joao.giordani-donasolo/Tiny_Reasoner/results/sft_baseline"
experiment_name: sft_baseline
